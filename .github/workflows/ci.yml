name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ""
      # The formatter tests run the real weft binary.
      - run: cargo install --git https://github.com/weft-sdk/weft weft-cli --locked --root "$HOME/.weft"
      - run: npm ci
      - run: npm test
        env:
          WEFT_BIN: /home/runner/.weft/bin/weft
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
